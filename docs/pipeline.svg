<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b7a72"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="430" rx="8" fill="#ffffff"/>

  <!-- ================= KG PIPELINE ================= -->
  <text x="34" y="80" transform="rotate(-90 34 80)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b9b9b" letter-spacing="0.5">KG PIPELINE</text>

  <!-- StVO Legal Text -->
  <rect x="62" y="52" width="112" height="56" rx="4" fill="#f2f2f3" stroke="#8f8f96" stroke-width="1.1"/>
  <text x="118" y="74" text-anchor="middle" font-size="13" font-style="italic" fill="#1c1c1e">StVO</text>
  <text x="118" y="92" text-anchor="middle" font-size="13" fill="#1c1c1e">Legal Text</text>

  <!-- KG Parser -->
  <rect x="206" y="52" width="106" height="56" rx="5" fill="#eef3fb" stroke="#33558c" stroke-width="1.2"/>
  <text x="259" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2f50">KG</text>
  <text x="259" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2f50">Parser</text>

  <!-- LLM Translator -->
  <rect x="344" y="52" width="112" height="56" rx="5" fill="#f6eef8" stroke="#6d3576" stroke-width="1.2"/>
  <text x="400" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2352">LLM</text>
  <text x="400" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2352">Translator</text>

  <!-- Knowledge Graph -->
  <rect x="488" y="44" width="168" height="72" rx="4" fill="#f2f2f3" stroke="#8f8f96" stroke-width="1.1"/>
  <text x="572" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1c1e">Knowledge Graph</text>
  <text x="572" y="94" text-anchor="middle" font-size="12" fill="#3d3d42">554 nodes / 945 edges</text>

  <!-- TransE Training -->
  <rect x="688" y="52" width="112" height="56" rx="5" fill="#eef3fb" stroke="#33558c" stroke-width="1.2"/>
  <text x="744" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2f50">TransE</text>
  <text x="744" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2f50">Training</text>

  <!-- e_p -->
  <rect x="832" y="52" width="118" height="56" rx="4" fill="#f2f2f3" stroke="#8f8f96" stroke-width="1.1"/>
  <text x="891" y="86" text-anchor="middle" font-size="14" fill="#1c1c1e"><tspan font-style="italic" font-weight="700">e</tspan><tspan dy="4" font-size="10">p</tspan><tspan dy="-4"> ∈ ℝ</tspan><tspan dy="-5" font-size="10">d</tspan></text>

  <!-- KG arrows -->
  <line x1="174" y1="80" x2="200" y2="80" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="312" y1="80" x2="338" y2="80" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="325" y="72" text-anchor="middle" font-size="9.5" fill="#6b6b70">DE</text>
  <line x1="456" y1="80" x2="482" y2="80" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="469" y="72" text-anchor="middle" font-size="9.5" fill="#6b6b70">EN</text>
  <line x1="656" y1="80" x2="682" y2="80" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="800" y1="80" x2="826" y2="80" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ soft-target link: e_p -> CLU ============ -->
  <path d="M 891 108 L 891 168 L 470 168 L 470 246" fill="none" stroke="#2b7a72" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrowTeal)"/>
  <text x="676" y="161" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b7a72">soft targets embeddings (CLU)</text>

  <!-- ================= LM PIPELINE ================= -->
  <text x="34" y="300" transform="rotate(-90 34 300)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9b9b9b" letter-spacing="0.5">LM PIPELINE</text>

  <!-- Base BERT -->
  <rect x="62" y="272" width="112" height="56" rx="4" fill="#f2f2f3" stroke="#8f8f96" stroke-width="1.1"/>
  <text x="118" y="294" text-anchor="middle" font-size="13" fill="#1c1c1e">Base</text>
  <text x="118" y="312" text-anchor="middle" font-size="13" fill="#1c1c1e">BERT</text>

  <!-- multi-task pre-training container -->
  <rect x="206" y="246" width="528" height="108" rx="6" fill="#eef3fb" stroke="#33558c" stroke-width="1.3"/>
  <text x="470" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#33558c">KG-guided multi-task pre-training</text>

  <rect x="286" y="288" width="104" height="42" rx="4" fill="#eaf5f3" stroke="#2b7a72" stroke-width="1.2"/>
  <text x="338" y="314" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e5a54">NSP</text>

  <rect x="418" y="288" width="104" height="42" rx="4" fill="#eaf5f3" stroke="#2b7a72" stroke-width="1.2"/>
  <text x="470" y="314" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e5a54">CLU</text>

  <rect x="550" y="288" width="104" height="42" rx="4" fill="#eaf5f3" stroke="#2b7a72" stroke-width="1.2"/>
  <text x="602" y="314" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e5a54">CLS</text>

  <!-- Pre-trained Legal BERT -->
  <rect x="766" y="272" width="122" height="56" rx="5" fill="#eef3fb" stroke="#33558c" stroke-width="1.2"/>
  <text x="827" y="294" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2f50">Pre-trained</text>
  <text x="827" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2f50">Legal BERT</text>

  <!-- Evaluations -->
  <rect x="920" y="272" width="112" height="56" rx="5" fill="#fdf1e5" stroke="#a35a17" stroke-width="1.3"/>
  <text x="976" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4211">Evaluations</text>

  <!-- LM arrows -->
  <line x1="174" y1="300" x2="200" y2="300" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="734" y1="300" x2="760" y2="300" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="888" y1="300" x2="914" y2="300" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- total loss -->
  <text x="470" y="382" text-anchor="middle" font-size="13.5" fill="#2b2b2f">
    <tspan font-style="italic">ℒ</tspan><tspan dy="4" font-size="9.5">total</tspan><tspan dy="-4"> = λ</tspan><tspan dy="4" font-size="9.5">NSP</tspan><tspan dy="-4" font-style="italic">ℒ</tspan><tspan dy="4" font-size="9.5">NSP</tspan><tspan dy="-4"> + λ</tspan><tspan dy="4" font-size="9.5">CLU</tspan><tspan dy="-4" font-style="italic">ℒ</tspan><tspan dy="4" font-size="9.5">CLU</tspan><tspan dy="-4"> + λ</tspan><tspan dy="4" font-size="9.5">CLS</tspan><tspan dy="-4" font-style="italic">ℒ</tspan><tspan dy="4" font-size="9.5">CLS</tspan>
  </text>
</svg>
